<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80%;
            border: 1px solid black;
            margin: auto;
            padding: 5px;
        }
        header{
            background-color: aqua;
            height: 90px;
            width: 100%;
            margin-bottom: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        main{
            border: 1px solid blue;
            height: 300px;
            padding-left: 10px;
        }
        footer{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: grey;
            height: 70px;
            margin-top: 10px;

        }
        button:hover{
            background-color: blue;
            cursor: pointer;
            color: white;
            transform: scale(1.2);
            
        }
        /* the color is not changing because you used in line css */
    </style>
</head>
<body>
    <div class="container">
        <header>
<h1 style="text-align: center;">Welcome to My Page</h1>
<p style="text-align: center;">This is a simple example with divs and CSS</p>
        </header>
        <main>
            <h2>About</h2>
            <p>This section is inside the content div.You can add text,images,or anything here.</p>
            <button style="background-color: green; color: white; border: none; width: 100px; height: 40px;">Click Me</button>
        </main>
        <footer>
            &copy;2025 My Simple Website
        </footer>
    </div>
</body>
</html>
