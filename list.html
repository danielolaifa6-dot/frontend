<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Lists in html</h2>
    <h2>Unordered list</h2>
    <p>ul tag is used to define unordered list</p>
    <ul>
        <li>beans</li>
        <li>rice</li>
        <li>plantain</li>
    </ul>
    <p>ol tag is used to define ordered list</p>
    <ol type="A">
        <li>beans</li>
        <li>rice</li>
        <li>plantain</li>
    </ol>
<button style="background-color: blue; color: white; border-radius: 8px;">SUBMIT</button>
<input style="background-color: blue; color: white;" type="submit">


</body>
</html>
