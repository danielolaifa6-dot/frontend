<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: blue;
            border-radius: 10px;
            width: 100px;
            height: 100px;
            animation-iteration-count: infinite;
            animation-duration: 4s;
            animation-direction: normal;
            animation-name: example;
            /* or animation: example 4s normal; */
            /* to make the div move add positioning */
            position: relative;
        }
        @keyframes example{
           0%{ background-color: blue; left: 0; top: 0;}
           25%{ background-color: red; left: 200px; top: 0;}
           50%{ background-color: orange; left: 200px; top: 200px;}
           75%{ background-color: green; left: 0; top: 200px;}
           100%{background-color: purple; left: 0; top: 0;}
        }
    </style>
</head>
<body>
   <!-- animations in html  -->
    <div class="box"></div>
</body>
</html>
