<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
.request-button{
    background-color: black;
    color: white;
    height:36px ;
    width: 105px; 
    border: none;
    cursor:pointer ;
    margin-right: 8px;

}
.request-button:hover{opacity: 0,8;}
.request-button:active{opacity: 0.7;}

.Add-button{
    background-color: rgb(255, 216, 20);
    border-radius: 18px;
    border: none;
    width: 170px;
    height: 36px;
    color:black ;
    margin-right: 8px;
    

}
.Sign-button{
    background-color: rgb(21, 202, 24);
    border: none;
    width: 90px;
    border-radius: 8px;
    height: 36px;
    transition: box-shadow 0.15s;
    margin-right: 8px;
    
    
}
.Sign-button:hover{box-shadow:10px 10px 10px rgba(0, 0, 0, 0.15) ;


}
.Apply-button{
background-color: rgb(72, 72, 255);
height: 36px;
border: none;
border-radius: 17px;
color: white;
width: 200px; 
transition: background-color 0.15s,
color 0.15s ;
cursor: pointer;
}
.Apply-button:hover{ background-color: rgb(10, 10, 97);}
.Save-button{
    background-color: white;
    border-radius: 25px;
    border: solid;
    height: 36px;
    border-color: blue;
    width: 70px;
    border-width: 1px;
    transition:background-colour 0.15s,
    color 0.15s ;
    margin-right: 8px;

}
.Save-button:hover{ background-color: rgb(56, 56, 234);}


    </style>
    <button class=" Add-button"> Add to Cart</button>
    <button class=" request-button">Request now</button>
    <button class="Sign-button"> Sign up</button>
    <button class="Apply-button">Apply on company website</button>
    <button class="Save-button">Save</button>
    
</body>
</html>
