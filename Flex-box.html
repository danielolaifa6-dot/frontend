<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex ;
            width: 500px;
            height: 300px;
            min-height: 100px;
            border-radius: 15px;
            background-color: blue;
            gap: 20px;
            justify-content: space-around;
            flex-wrap: wrap-reverse;
            

            
        }
         .container div{
            background-color: green;
            color: white;
            width: 100px;
            height: 80px;
            text-align: center;
            display: flex;
            
            align-items: center;
            justify-content: center;
            


        }
        /* any element you add "flex 1" to will take even spaces */
        /* justify content for horizontal arrangement *
        align- items for vertical arrangement
        flex-direction arranges object in columns */
        


    </style>
</head>
<body>
    <div class="container">
<div>Apple</div>
<div>Bannana</div>
<div>Mango</div>
<div>Guava</div>
<div> cherry</div>
<div>Lemon</div>
<div>Pineapple</div>
<div>Water melon</div>
</body>
</html>
