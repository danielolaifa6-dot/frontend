<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid black;
            width: 90%;
            border-collapse: collapse;
            
        
        }
        th,td{ border: 1px solid black;

        }
        td{
            text-align: center;
        }
        tr:hover{
            background-color: blue;
            color: white;
        }
        tr:nth-child(2) {
            background-color: green;
            color: white;
        
        }
        tr:nth-child(odd) {
            background-color: green;
            color: white;
        
        }
        tr:nth-child(even) {
            background-color: grey;
            color: white;
        
        }
        
    </style>

<body>
    <h1>Tables in html</h1>
    <p> table tag is used to define table in html</p>
    <p>tr is used to define table row</p>
    <p>th is used to define table head</p>
    <p>td is used to define table data</p>
    <table>
        <caption> Students Data</caption>
        <tr>
            <th> Name</th>
            <th>Age </th>
            <th>City</th>
        </tr>
        <tr>
            <td>Fola</td>
            <td>20</td>
            <td>Lagos</td>

        </tr>
        <tr>
            <td>folayemi</td>
            <td>26</td>
            <td>ibadan</td>
        </tr>
        <tr>
            <td>George</td>
            <td>16</td>
            <td>Abuja</td>
        </tr>
        <tr>
            <td>Janet</td>
            <td>20</td>
            <td>New york</td>
        </tr>
    </table>

</body>
</html>
