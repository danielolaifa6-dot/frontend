<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border-radius: 15px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 350px;
            min-height: 300px;
            align-items: center;
        }
        img{
            border-radius: 50%;
            width: 100px;
            height: 100px;
            margin-top: 5px;
            
        }
        button{
          width: 100px;
          height: 40px;
          padding: 6px;
          border-radius: 8px;
          cursor: pointer;
          background-color: blue;
          color: white;
          border: none;
        }
        button:hover{
            background-color: royalblue;
            color: white;
            transform: scale(1.1);
        }
        p{
            text-align: center;
        }

        /* justify content is used to adjust content you have in a tag */
    </style>
</head>
<body>
    <div class="card">
<img src="cat.jpeg" alt="cat">
<h1>John Doe</h1>
<p>Web developer who love html,Css and teaching beginners</p>
<button>Follow</button>
    </div>
</body>
</html>
