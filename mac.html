<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blueviolet;
        }
        form{
            border: 1px solid blue;
            padding: 10px;
            border-radius: 10px;
            padding-left: 30px;
            padding-right: 30px;
            padding-bottom: 30px;
            background-color: white;
            margin: 50px;box-shadow: 5px 5px 5px 5px;
        }
        input{
            padding: 10px;
            width: 300px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid blue;
        }
        button{
            padding:10px ;
            width: 320px;
            margin-top: 10px;
            background-color: green;
            color: white;
            border-radius: 8px;
            border: none;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
  <form action="submit.js">
    <h1>Create Account</h1>
    <p style="color: grey;">Join AccountHub today</p>
    <strong>Full Name</strong><br>
     <input type="full name" placeholder="John Doe"><br>
     <strong>Email</strong><br>
      <input type="email" placeholder="john@example.com"><br>
      <strong>Password</strong><br>
      <input type="password" placeholder="At least 6 characters"><br>
      <button>Sign up</button><br>
      <p style="color: grey; text-align: center;">Already have an account? <span style="color: blue;">Log in</span></p>
  </form>
</body>
</html>
